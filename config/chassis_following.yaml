# 扫拍节点直接读本文件。相机、光源、充电节点仍由各自 launch 载入参数服务器。
# 改完保存即可。扫拍参数在下一趟 run_sweep 或 IDLE 时重读，不用重启。

# ---------- 腕部 QVPS 防错相机 ----------
# 扫拍走 TCP（trigger_both 后台线程）。/chassis_following/capture 只给前端手动拍，避免扫拍占满服务。
# rosservice call /chassis_following/capture "{left_path: '', right_path: '/tmp/right.jpg'}"
capture_service: "/chassis_following/capture"   # 手动拍照服务名
qvps_program: "R-01"                         # 右腕报文，TCP 原文
qvps_left_program: "L-01"                         # 左腕报文，TCP 原文
qvps_port: 10008                               # 右腕 TCP 端口
qvps_left_port: 5000                           # 左腕 TCP 端口
qvps_timeout: 15                             # 等相机应答超时，秒
qvps_http_port: 80                             # 右腕取图 HTTP 端口
qvps_left_http_port: 80                      # 左腕取图 HTTP 端口
qvps_right_host: "192.168.217.51"              # 右腕相机 IP
qvps_left_host: "192.168.217.52"               # 左腕相机 IP

# ---------- 光源控制服务 ----------
# 服务通道 0 = 左手灯 192.168.217.2:2000，1 = 右手灯 192.168.217.3:2001。
# 两台控制器的报文通道都是 1。亮度超过 230 按 230 发。
# rosservice call /chassis_following/light_control/set "channel: 0  brightness: 255"
light_service: "/chassis_following/light_control/set"  # 光源服务名
light_left_host: "192.168.217.2"                       # 左手灯控制器 IP
light_left_port: 2000                                  # 左手灯控制器端口
light_right_host: "192.168.217.3"                      # 右手灯控制器 IP
light_right_port: 2001                                 # 右手灯控制器端口
light_timeout: 3.0                                     # 单次通信超时，秒
light_retries: 3                                       # 失败后重试次数，次

# ---------- 控制频率 ----------
rate: 50.0                                     # 状态机定时器频率，赫兹。10 表示每秒走 10 步

# ---------- 扫拍模式（节点内部，上层任务不带这个字段） ----------
# 0 = 定时拍照，导航到 sweep_end 结束。
# 1 = 欧式距离，按检测点拍照；点全部完成且超过本趟那一端后结束。
# 2 = 定时拍照，超过本趟那一端就结束。需要车型和 goal 里的底盘速度。
# 车尾开始时那一端是车头，车头开始时那一端是车尾。
sweep_mode: 1
# rear = 车尾开始，机器人和底盘同向，从车尾拍向车头。接到任务时机器人在车尾。
# front = 车头开始，相向而行。接到任务时机器人在车头，从车头拍向车尾。
# 只对模式 1、2 生效。模式 0 不读。
sweep_from: "front"
# 模式 1 扫拍中是否调用 movej/whole_body。false 不发开扫、拍照后和回举手的全身运动。
# 节点启动时的举手不受这项控制。
sweep_whole_body: false

# ---------- 地图点与导航（与前端导航同一坐标系，单位米、度） ----------
# 扫拍导航去 sweep_end，拍完导航回 map_home。全程不发手柄。
map_odom_topic: "/zj_humanoid/navigation/odom_info"     # 地图定位话题
nav_action: "/zj_humanoid/navigation/navigation"        # 导航 Action 名
map_home_x: 3.216  # 回家点 x，米
map_home_y: 0.037  # 回家点 y，米
map_home_yaw_deg: -179.73  # 回家点航向，度
map_arrive_tol_xy: 0.03  # 扫拍终点和回家的平面到位误差，米
map_arrive_tol_yaw_deg: 5  # 扫拍终点和回家的航向到位误差，度
nav_timeout: 90  # 单段导航超时，秒。扫拍、回家、去充电共用
sweep_end_x: -3.036  # 扫拍终点 x，米。模式 0/1/2 都导航向这个点
sweep_end_y: -0.14  # 扫拍终点 y，米
sweep_end_yaw_deg: -178.4  # 扫拍终点航向，度
# 下面三项只给模式 0 和模式 2 的定时拍照。模式 1 不读。
sweep_photo_move_m: 0.1  # 离开本趟起点这么远才开始计时拍照，米
sweep_photo_delay: 0.2  # 离开后再过这么久拍第 1 组，秒
sweep_photo_period: 0.5  # 第 1 组之后每隔这么久再拍一组，秒。不是距离

# ---------- 车头与检测点（模式 1、2 使用。模式 0 不读） ----------
# 车尾位置不再订阅话题。run_sweep 的 goal.speed 是底盘速度，米/秒。
# 停线时调用 /chassis_following/set_speed，data 传 true，从这一刻起把速度加载为 0。
# 车身按新速度积分，已经走过的位置保留，扫拍继续按相对位置触发。
# rear：接到任务时车尾 rear_s=0，之后沿机器人行走方向增加。
# front：接到任务时车头在机器人脚下，车尾在前方 rear_s=车长，车身迎面而来，rear_s 减小。
# 下面四项仍留在文件里，扫拍节点不再读取、不再订阅。
gripper_topic: "/chassis_following/gripper_s"  # 已停用
gripper_scale: 1                             # 已停用
gripper_offset: 0                            # 已停用
gripper_timeout: 1                           # 已停用
loc_timeout: 1                               # 地图定位超过这么久没更新则模式 1 暂停触发拍照，秒。导航不停
safety_margin: 0                            # 相向 front：home 到车头的初始距离，加在起点，检测点随之后移。同向 rear：超过车头后再加的余量，米
front_extra_m: 0                            # 超过本趟那一端后再多走这段才结束扫拍，米。两种方向都加在末端

# ---------- 外部触发 ----------
# 停止、复位是 Trigger 服务，请求体为 {}。
# stop：取消导航，进入 STOP_HOLD。
# reset：仅 STOP_HOLD 时导航回 home，到位后进 IDLE。
# 自身避障：拍摄中速度曾非 0，又持续全 0 达到 obstacle_zero_hold_sec，任务失败并立刻导航回 home。到家后 safety_state=reset。
cmd_vel_calib_topic: "/zj_humanoid/cmd_vel/calib"  # 自身避障速度话题，geometry_msgs/Twist
obstacle_zero_hold_sec: 3.0                      # 速度全为 0 需持续这么久才判定避障，秒
# 充电、结束充电是 Trigger 服务，请求体为 {}。
# /chassis_following/charge、/chassis_following/end_charge

# ---------- 举手（节点启动时按下面的关节角发一次 movej） ----------
# 服务名和 arm_type=15 写在 arm.py。这里只改时间和关节角。改完重启节点。
raise_time: 5.0                                # 举手运动时间，秒
raise_joints: [                                # 全身关节目标角，弧度。顺序与 arm.py 的 MoveJ 一致
  0.21437382107251324,
  0.14908376197126927,
  0.5049673146640998,
  -0.14927550957509084,
  -0.6881719635241553,
  -0.0355452120584232,
  0.5726900528331346,
  -0.487552277573079,
  -0.1467228695992162,
  0.20229372203175444,
  -0.5704970582701208,
  0.26302977554223617,
  -0.7049980554440026,
  -0.20713534902824904,
  0.5560255723435823,
  0.4049826268571523,
  -0.0007271221016204022,
  0.0011541046216401504,
  -0.8038958369093052,
  -0.10432867281679137,
  -0.0004194478833596804,
  0.7771530382888159
]

# ---------- 充电 ----------
# 1. charge_joints：离开 home 的姿态。空着时充电服务拒绝。
# 2. 单点普通导航到 charge_transform_*（姿态变换点），waypoints 只有这一点。
# 3. charge_pose_joints：到达姿态变换点后的姿态。
# 4. charge_prepare_points 按顺序放进另一次普通导航的 waypoints，末点是准备点。
# 5. 充电点单独发后向充电，然后请求充电服务。
# 两段 movej 都用 charge_time。独立脚本 run_charge.py 不摆姿态，只发充电点。
charge_time: 5.0                                  # 两段充电相关姿态的运动时间，秒。小于 3 秒按 5 秒发
charge_joints:                               # 离开 home 前的全身关节角，弧度。22 个。空着时不去充电
