charge_transform_set: true                       # 前端写入姿态变换点并保存后为 true
charge_transform_x: 4.244                           # 姿态变换点 x，米。单点普通导航
charge_transform_y: -3.633                           # 姿态变换点 y，米
charge_transform_yaw_deg: -93.06                     # 姿态变换点航向，度
# 充电准备点。按顺序放进同一次普通导航的 waypoints，最后一点是准备点。
charge_prepare_points:
  - {x: 4.78, y: -4.064, yaw_deg: -79.54}
  - {x: 5.56, y: -4.469, yaw_deg: -84.4}
charge_action: "/zj_humanoid/navigation/navigation"   # 去充电用的导航 Action 名
charge_service: "/zj_humanoid/chassis/agv_charge"     # 内部充电服务。请求字段 enable 为 true/false
charge_x: 5.528                                         # 充电点 x，米
charge_y: -4.21                                         # 充电点 y，米
charge_yaw_deg: -84.04                                  # 充电点航向，度
charge_arrive_tol_xy: 0.1                             # 充电点平面到位误差，米
charge_arrive_tol_yaw_deg: 1                       # 充电点航向到位误差，度。约 0.1 弧度，与厂商示例一致
charge_wait_server: 30.0                              # 独立充电脚本等待导航 Action 就绪的时间，秒

# ---------- 拍照存盘 ----------
retain_days: 7                                     # 日志和照片保留天数。更早的删除
save_images: true                                # 是否把照片保存到本地。false 仍发检测，不取图、不写文件
capture_dir: "/shared/catkin_ws/src/chassis_following/shots"  # 照片根目录。每趟在其下新建子目录
