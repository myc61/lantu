# 车型和检测点。纵向单位都是米。车长在 capture_layout.length。
# 模式 1 用检测点；模式 2 用车长判断车头。
# capture.sides：both=左右都拍，left=只拍左腕，right=只拍右腕。不写则 both。
# pose.joints：模式 1 全身 22 关节。不写则该点不发 movej。t 是运动时间，秒。is_async 固定 true。
# capture_layout：车长、相机视野、前后重叠。重叠为负表示相邻照片重叠，-0.1 即重叠 0.1 米。
# 检测点 s 是照片中心到车尾的距离。视野默认 1 米。
vehicle_models:

  SUV_A:
    reference:
      origin: rear
    capture_layout:
      length: 5.4
      fov: 1
      overlap: -0.1
    detection_points:
      - id: P01
        position:
          s: 0.4
        enabled: true
        capture:
          tolerance: 0.1
          sides: both
        pose:
          t: 2
          joints: [-0.002169, -0.401076, 0.146303, 0.029182, -0.453677, 0.001582, 0.835134, -0.068151, -0.004039, -0.580863, -0.144266, 0.019355, -0.164332, 0.19907, 0.731848, 0.256316, -0.000338, 0.000343, -0.699795, -0.016496, 0.000204, 0.775769]
